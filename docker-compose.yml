version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sarangsho-postgres
    restart: always
    environment:
      POSTGRES_DB: sarangsho
      POSTGRES_USER: sarangsho_user
      POSTGRES_PASSWORD: your_secure_db_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: sarangsho-backend
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://sarangsho_user:your_secure_db_password@postgres/sarangsho
      SECRET_KEY: your_random_jwt_secret_key_here
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: sarangsho-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data: